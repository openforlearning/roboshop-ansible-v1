---
- name: create ec2 instance and route53 records
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    instances: [ "mongodb", "redis", "mysql", "rabbitmq" ]
    instance_action: create
    domain_name: sidsam.space
    region: us-east-1
    ami_id: ami-0055977a6e828a4f4
    instance_type: t3.micro
    vpc_id: vpc-03d1ac63925d03215
  tasks:
    - name: create ec2 instance
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ ami_id }}"
        region: "{{ region }}"
        security_group: 
          - "roboshop-{{ item }}"
          - "roboshop-common"
        vpc_subnet_id: "{{ vpc_id }}"
        wait: yes
        state: "{{ instance_action }}" 
      loop: "{{ instances }}"
      when: instance_action == 'create'

      